<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Example test report in a GitHub Actions job summary</title>
  <desc id="desc">A GitHub-style test report showing 21 passed tests, one failed test, two flaky tests, and failure details with a source link.</desc>
