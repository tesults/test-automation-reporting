name: Test Automation Reporting for GitHub Actions
description: GitHub-native test reports with failures, logs, retries, steps, screenshots, and attachments.
author: Tesults

inputs:
  junit-xml:
    description: Path or glob for JUnit XML result files, relative to the workspace. Multiple patterns may be supplied on separate lines.
    required: false
    default: ""
  store-attachments:
    description: Store screenshots, logs, and other captured test files as a GitHub Actions artifact for 1 day.
    required: false
    default: "false"

runs:
  using: node24
  main: src/main.js
  post: src/post.js
  post-if: always()

branding:
  icon: bar-chart-2
  color: blue
