name: Test Automation Reporting for GitHub Actions
description: GitHub-native test reports with failures, logs, retries, steps, screenshots, and attachments.
author: Tesults

inputs:
  upload-attachments:
    description: Upload screenshots, logs, and other captured test files as a GitHub Actions artifact.
    required: false
    default: "true"

runs:
  using: node24
  main: src/main.js
  post: src/post.js
  post-if: always()

branding:
  icon: bar-chart-2
  color: blue
