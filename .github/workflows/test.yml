name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test

      - name: Set up action integration test
        id: setup-action
        uses: ./

      - name: Write representative reporter output
        shell: bash
        run: |
          node -e 'require("fs").writeFileSync(process.env.TESULTS_OUTPUT_FILE, JSON.stringify({target:"",results:{cases:[{suite:"self-test",name:"passes",result:"pass",duration:20},{suite:"self-test",name:"fails",result:"fail",duration:30,reason:"representative failure"}]},metadata:{test_framework:"self-test"}}))'

      - name: Finalize action integration test
        id: report
        if: always()
        uses: ./
        with:
          mode: finalize
          report-title: Action integration test
          report-detail: failures
          max-annotations: 0

      - name: Verify action outputs
        if: always()
        shell: bash
        run: |
          test "${{ steps.report.outputs.conclusion }}" = "failure"
          test "${{ steps.report.outputs.passed }}" = "1"
          test "${{ steps.report.outputs.failed }}" = "1"
          test "${{ steps.report.outputs.total }}" = "2"
          test "${{ steps.report.outputs.time }}" = "50"

      - name: Upload action integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tesults-action-integration-results-${{ matrix.os }}
          path: ${{ steps.setup-action.outputs.results-file }}
          retention-days: 1

  cross-job-report:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: tesults-action-integration-results-*
          path: cross-job-results
          merge-multiple: true
      - name: Report downloaded results
        id: cross-job-report
        uses: ./
        with:
          mode: finalize
          working-directory: cross-job-results
          results-file: "*.json"
          report-title: Cross-job integration test
          max-annotations: 0
      - name: Verify cross-job outputs
        shell: bash
        run: |
          test "${{ steps.cross-job-report.outputs.conclusion }}" = "failure"
          test "${{ steps.cross-job-report.outputs.passed }}" = "3"
          test "${{ steps.cross-job-report.outputs.failed }}" = "3"
          test "${{ steps.cross-job-report.outputs.total }}" = "6"
          test "${{ steps.cross-job-report.outputs.time }}" = "150"

  jest-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/jest/package-lock.json
      - name: Install Jest example dependencies
        working-directory: examples/jest
        run: npm ci
      - name: Set up Jest example reporting
        id: jest-report-setup
        uses: ./
        with:
          working-directory: examples/jest
      - name: Run Jest example
        working-directory: examples/jest
        run: npm test
      - name: Verify Jest reporter output
        if: always()
        shell: bash
        run: |
          node test/verify-example-results.js "${{ steps.jest-report-setup.outputs.results-file }}" jest

  playwright-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/playwright/package-lock.json
      - name: Install Playwright example dependencies
        working-directory: examples/playwright
        run: npm ci
      - name: Install Chromium
        working-directory: examples/playwright
        run: npx playwright install --with-deps chromium
      - name: Set up Playwright example reporting
        id: playwright-report-setup
        uses: ./
        with:
          working-directory: examples/playwright
      - name: Run Playwright example
        working-directory: examples/playwright
        run: npm test
      - name: Verify Playwright reporter output
        if: always()
        run: node test/verify-example-results.js "${{ steps.playwright-report-setup.outputs.results-file }}" playwright

  vitest-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/vitest/package-lock.json
      - name: Install Vitest example dependencies
        working-directory: examples/vitest
        run: npm ci
      - name: Set up Vitest example reporting
        id: vitest-report-setup
        uses: ./
        with:
          working-directory: examples/vitest
      - name: Run Vitest example
        working-directory: examples/vitest
        run: npm test
      - name: Verify Vitest reporter output
        if: always()
        run: node test/verify-example-results.js "${{ steps.vitest-report-setup.outputs.results-file }}" vitest

  pytest-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: examples/pytest/requirements.txt
      - name: Install pytest example dependencies
        run: python -m pip install -r examples/pytest/requirements.txt
      - name: Set up pytest example reporting
        id: pytest-report-setup
        uses: ./
        with:
          working-directory: examples/pytest
      - name: Run pytest example
        working-directory: examples/pytest
        run: python -m pytest
      - name: Verify pytest reporter output
        if: always()
        run: node test/verify-example-results.js "${{ steps.pytest-report-setup.outputs.results-file }}" pytest

  cypress-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/cypress/package-lock.json
      - name: Install Cypress example dependencies
        working-directory: examples/cypress
        run: npm ci
      - name: Set up Cypress example reporting
        id: cypress-report-setup
        uses: ./
        with:
          working-directory: examples/cypress
      - name: Run Cypress example
        working-directory: examples/cypress
        run: npm test
      - name: Verify Cypress reporter output
        if: always()
        run: node test/verify-example-results.js "${{ steps.cypress-report-setup.outputs.results-file }}" cypress

  junit5-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: examples/junit5/pom.xml
      - name: Set up JUnit 5 example reporting
        id: junit5-report-setup
        uses: ./
        with:
          working-directory: examples/junit5
      - name: Run JUnit 5 example
        working-directory: examples/junit5
        run: mvn --batch-mode test
      - name: Verify JUnit 5 reporter output
        if: always()
        run: node test/verify-example-results.js "${{ steps.junit5-report-setup.outputs.results-file }}" junit

  xunit-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Set up xUnit example reporting
        uses: ./
        with:
          working-directory: examples/xunit
          junit-xml: 'TestResults/**/*.xml'
      - name: Run xUnit example
        working-directory: examples/xunit
        run: dotnet test --logger:junit --results-directory TestResults
      - name: Finalize xUnit example report
        id: xunit-report
        if: always()
        uses: ./
        with:
          mode: finalize
          working-directory: examples/xunit
          junit-xml: 'TestResults/**/*.xml'
          max-annotations: 0
      - name: Verify xUnit report outputs
        if: always()
        shell: bash
        run: |
          test "${{ steps.xunit-report.outputs.conclusion }}" = "success"
          test "${{ steps.xunit-report.outputs.passed }}" = "2"
          test "${{ steps.xunit-report.outputs.failed }}" = "0"
          test "${{ steps.xunit-report.outputs.total }}" = "2"
